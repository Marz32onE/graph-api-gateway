name: CI

# `lint`, `vuln`, `test`, `docs-drift`, and `vendor-drift` are separate jobs;
# they run in parallel (no `needs` edges) so PR feedback latency = max, not sum.
on:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=5m

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: go test ./... -count=1 -race -shuffle=on

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pre-download modules so `swag init` does not race the module cache
      # while parsing transitive deps; without this the CI runner hits
      # "cannot find all dependencies" and swag exits 1.
      - name: Pre-download modules
        run: go mod download

      # Single source of truth: `make check-docs` regenerates the OpenAPI spec
      # via the `swag` tool pinned in go.mod (`tool` directive) and diffs both
      # docs/ and the embedded internal/api/static/openapi/ payload.
      - name: Verify docs in sync
        run: make check-docs

  vendor-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Single source of truth: `make check-vendor` re-runs `go mod vendor` and
      # fails if vendor/, go.mod, or go.sum diverge from what is committed —
      # catches a stale vendor tree or a forgotten `make vendor` after a
      # kube-state-graph version bump. A clean tree is the offline-build
      # contract (go uses -mod=vendor automatically when vendor/ exists).
      - name: Verify vendor in sync
        run: make check-vendor
