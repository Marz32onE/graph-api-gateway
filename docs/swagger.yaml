components:
  schemas:
    cytoscape.Body:
      properties:
        apiVersion:
          type: string
        clusters:
          items:
            type: string
          type: array
          uniqueItems: false
        elements:
          $ref: '#/components/schemas/cytoscape.Elements'
      type: object
    cytoscape.Edge:
      properties:
        data:
          $ref: '#/components/schemas/cytoscape.EdgeData'
      type: object
    cytoscape.EdgeData:
      properties:
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        source:
          type: string
        target:
          type: string
        type:
          type: string
      type: object
    cytoscape.Elements:
      properties:
        edges:
          items:
            $ref: '#/components/schemas/cytoscape.Edge'
          type: array
          uniqueItems: false
        nodes:
          items:
            $ref: '#/components/schemas/cytoscape.Node'
          type: array
          uniqueItems: false
      type: object
    cytoscape.Node:
      properties:
        data:
          $ref: '#/components/schemas/cytoscape.NodeData'
      type: object
    cytoscape.NodeData:
      properties:
        id:
          type: string
        ipaddress:
          items:
            type: string
          type: array
          uniqueItems: false
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        parent:
          type: string
        type:
          type: string
      type: object
    internal_api.errorResponse:
      properties:
        error:
          type: string
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: API key presented in the `X-API-Key` header. Required on `/v1/*`
        when the gateway is started with keys configured. Health and docs routes are
        exempt.
      in: header
      name: X-API-Key
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  description: |-
    HTTP gateway that runs a sequential pipeline: (1) build the kube-state-graph graph in-process from the inbound query (an embedded engine querying VictoriaMetrics directly), (2) extract `data.ipaddress` from every `node`-type entry, (3) if any IPs were collected, POST those IPs to the switch backend batched as a single `[{"ip":…}]` JSON body, (4) re-anchor switch shadow nodes onto kube node IDs via IP match, (5) merge into a single Cytoscape.js envelope. Emits structured logs via slog. Any backend failure returns `502`.

    **Authentication.** When the gateway is started with API keys configured (`API_KEYS` or `API_KEYS_FILE`), every request to `/v1/*` MUST carry an `X-API-Key: <key>` header. Missing or invalid keys yield `401 Unauthorized`. Health probes (`/livez`, `/readyz`), the OpenAPI spec (`/openapi.*`), and the Swagger UI (`/docs/*`) are exempt and require no key.
  title: graph-api-gateway
  version: v1
openapi: 3.1.0
paths:
  /livez:
    get:
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: ok
      summary: Liveness probe
      tags:
      - health
  /openapi.json:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OpenAPI 3.1 JSON
      summary: OpenAPI spec (JSON)
      tags:
      - docs
  /readyz:
    get:
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: ok
        "503":
          content:
            text/plain:
              schema:
                type: string
          description: not ready
      summary: Readiness probe
      tags:
      - health
  /v1/graph:
    get:
      description: 'Runs a sequential pipeline: (1) build the kube-state-graph graph
        in-process from the inbound query (an embedded engine querying VictoriaMetrics
        directly — no HTTP hop); (2) collect `data.ipaddress` from every `node`-type
        entry; (3) if any IPs were collected, call the switch backend as `POST /v1/graph`
        with a JSON body `[{"ip":"<a>"},{"ip":"<b>"}]` (all IPs batched into one request);
        (4) re-anchor the switch graph onto kube node IDs by matching `data.ipaddress`
        (switch shadow nodes are dropped, their edge references rewritten); (5) merge
        primary + reconciled switch (union nodes by `data.id` with kube winning, dedup
        edges by `(type,source,target)`). Any stage failure returns `502`.'
      parameters:
      - description: Window start (RFC 3339 or Unix seconds) — forwarded to kube-state-graph
        in: query
        name: start
        schema:
          type: string
      - description: Window end (RFC 3339 or Unix seconds) — forwarded to kube-state-graph
        in: query
        name: end
        schema:
          type: string
      - description: Restrict to a cluster (repeatable) — forwarded to kube-state-graph
        in: query
        name: cluster
        schema:
          type: string
      - description: Restrict to a namespace (repeatable) — forwarded to kube-state-graph
        in: query
        name: namespace
        schema:
          type: string
      - description: Restrict edges by type (repeatable) — forwarded to kube-state-graph
        in: query
        name: edge_type
        schema:
          type: string
      - description: Restrict to nodes whose name matches exactly (repeatable) — forwarded
          to kube-state-graph
        in: query
        name: name
        schema:
          type: string
      - description: Anchor a traversal at a node id — forwarded to kube-state-graph
        in: query
        name: root
        schema:
          type: string
      - description: Traversal depth — forwarded to kube-state-graph
        in: query
        name: depth
        schema:
          type: integer
      - description: Traversal direction (`in`|`out`|`both`) — forwarded to kube-state-graph
        in: query
        name: direction
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/cytoscape.Body'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api.errorResponse'
          description: missing or invalid X-API-Key (when auth enabled)
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api.errorResponse'
          description: Bad Gateway
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_api.errorResponse'
          description: Gateway Timeout
      security:
      - ApiKeyAuth: []
      summary: Merged kube + switch graph (Cytoscape.js)
      tags:
      - graph
servers:
- url: /
